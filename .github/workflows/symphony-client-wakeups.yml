name: Symphony Client Wakeups

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "7,22,37,52 * * * *"
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_run:
    types: [completed]
  status:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  wake:
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'symphony')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event.workflow_run.event)) ||
      (github.event_name == 'check_run' &&
        github.event.check_run.check_suite.app.slug != 'github-actions') ||
      github.event_name == 'status' ||
      github.event_name == 'push' || github.event_name == 'schedule'
    uses: 1000lines/symphony-client-workflows/.github/workflows/symphony-linear-wakeups.yml@main
    with:
      target-repository: "jeremycarroll/venn-search-rs"
      target-default-branch: "main"
      event-name: ${{ github.event_name }}
      event-payload: ${{ toJSON(github.event) }}
      helpers-repository: 1000lines/symphony-client-workflows
      helpers-ref: main
    secrets:
      CADENCE_LINEAR_API_TOKEN: ${{ secrets.CADENCE_LINEAR_API_TOKEN }}
